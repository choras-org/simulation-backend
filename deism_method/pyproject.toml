[project]
name = "deism_interface"
version = "0.1.0"
description = "Python package for DEISM (image-source) acoustic simulation."
requires-python = ">=3.11"
authors = [
    { name = "Zeyu Xu" },
]
keywords = [
    "image-source-method",
    "acoustic simulation",
    "geometrical acoustics",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.23.0",
    "matplotlib",
    "requests",
    "gmsh",
    "deism==2.2.1.13",
]

[project.optional-dependencies]
deploy = [
    "twine",
    "wheel",
    "build",
    "setuptools",
    "bump-my-version",
]

tests = [
    "pytest",
    "pytest-cov",
    "watchdog",
    "ruff",
    "coverage",
]

docs = [
    "sphinx",
    "autodocsumm>=0.2.14",
    "pydata-sphinx-theme",
    "sphinx_mdinclude",
    "sphinx-design",
    "sphinx-favicon",
    "sphinx-reredirects",
]

dev = ["deism_interface[deploy,tests,docs]"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deism_interface"]

[tool.setuptools.package-data]
deism_interface = ["examples/*.yml"]

[project.scripts]
deism_interface = "deism_interface:main"
