[project]
name = "pyroomacoustics_interface"
version = "0.1.0"
description = "Python package for acoustics research."
requires-python = ">=3.11"
authors = [
    { name = "Marco Berzborn", email = "m.berzborn@tue.nl" },
]
keywords = [
    "pyroomacoustics",
    "ray-tracing",
    "image-source method",
    "acoustic simulation",
    "geometrical acoustics",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.23.0",
    "gmsh",
    "pyroomacoustics>=0.8.0",
    "requests",
    "pyfar>=0.8.0",
]

[project.optional-dependencies]
deploy = [
    "twine",
    "wheel",
    "build",
    "setuptools",
    "bump-my-version",
]

tests = [
    "pytest",
    "pytest-cov",
    "watchdog",
    "ruff",
    "coverage",
]

docs = [
    "sphinx",
    "autodocsumm>=0.2.14",
    "pydata-sphinx-theme",
    "sphinx_mdinclude",
    "sphinx-design",
    "sphinx-favicon",
    "sphinx-reredirects",
]

dev = ["pyroomacoustics_interface[deploy,tests,docs]"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pyroomacoustics_interface"]

[project.scripts]
pyroomacoustics_interface = "pyroomacoustics_interface:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
