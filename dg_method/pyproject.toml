[project]
name = "dg_interface"
version = "0.1.0"
description = "Python package for DG acoustic simulation."
requires-python = ">=3.11,<3.14"
authors = [
    { name = 'The CHORAS developers' },
    { name = "Silvin Willemsen", email = "s.willemsen@tue.nl" },
]
keywords = [
    "discontinuous-galerkin",
    "acoustic simulation",
    "geometrical acoustics",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.23.0",
    "numpy-stl==3.1.1",
    "matplotlib",
    "requests",
    # gmsh has no linux aarch64 pip wheel; on arm64 it comes from the apt
    # `python3-gmsh` package. Keep the pip wheel on x86_64 (incl. cloud/amd64).
    "gmsh==4.13.1 ; platform_machine == 'x86_64'",
    "edg-acoustics @ git+https://github.com/Building-acoustics-TU-Eindhoven/edg-acoustics.git@08cac98da98ed14ba1366741b1c0644001503b82",
    "acousticDE @ git+https://github.com/Building-acoustics-TU-Eindhoven/acousticDE.git@d32afb2498e27bd996fc7356d57dc4f1ed76aa44",
]

[project.optional-dependencies]
deploy = [
    "twine",
    "wheel",
    "build",
    "setuptools",
    "bump-my-version",
]

tests = [
    "pytest",
    "pytest-cov",
    "watchdog",
    "ruff",
    "coverage",
]

docs = [
    "sphinx",
    "autodocsumm>=0.2.14",
    "pydata-sphinx-theme",
    "sphinx_mdinclude",
    "sphinx-design",
    "sphinx-favicon",
    "sphinx-reredirects",
]

dev = ["dg_interface[deploy,tests,docs]"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dg_interface"]

[tool.setuptools.dynamic]

[project.scripts]
dg_interface = "dg_interface:main"

