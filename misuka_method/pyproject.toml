[project]
name = "misuka_interface"
version = "0.0.1"
description = ""
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Timon Schnell", email = "t.schnell@campus.tu-berlin.de" },
]
keywords = [
    "acoustic simulation",
    "geometrical acoustics",
    "open-source",
    "acoustic path tracing",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.23.0",
    "requests",
    "gmsh",
    "meshio",
    "pyfar<0.10.0",
    "pyrato>=1.0.0",
    "pandas",
]

[project.optional-dependencies]
deploy = [
    "twine",
    "wheel",
    "build",
    "setuptools",
    "bump-my-version",
]

tests = [
    "pytest",
    "pytest-cov",
    "watchdog",
    "ruff",
    "coverage",
]

docs = [
    "sphinx",
    "autodocsumm>=0.2.14",
    "pydata-sphinx-theme",
    "sphinx_mdinclude",
    "sphinx-design",
    "sphinx-favicon",
    "sphinx-reredirects",
]

dev = ["misuka_interface[deploy,tests,docs]"]

# Source of truth for misuka_interface's release version, scoped-tagged so
# it doesn't collide with the other methods sharing this repo.
[tool.bumpversion]
current_version = "0.0.1"
commit = true
tag = true
tag_name = "misuka-v{new_version}"
message = "Bump misuka_interface version: {current_version} → {new_version}"
tag_message = "Bump misuka_interface version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["misuka_interface"]

[project.scripts]
misuka_interface = "misuka_interface:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
