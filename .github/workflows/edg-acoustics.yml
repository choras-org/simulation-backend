name: DG Method CI

on:
  push:
    branches:
      - "**"
    tags:
      - "dg-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish as an image, e.g. dg-v0.2.0
        required: true
        type: string

jobs:
  uv-test:
    name: Pytest for the discontinuous Galerkin method interface
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 mesa-utils gmsh

      - name: Run test for dg method
        run: |
          cd dg_method
          uv run --extra tests pytest tests/

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker Image
        run: |
          docker build -f dg_method/Dockerfile . --platform=linux/amd64 -t dg-method-test:latest

  publish:
    name: Publish Docker image
    if: startsWith(github.ref, 'refs/tags/dg-v') || startsWith(inputs.tag, 'dg-v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-method-image.yml
    with:
      method: dg
      tag: ${{ inputs.tag || github.ref_name }}
