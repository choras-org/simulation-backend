name: DEISM Method CI

on:
  push:
    branches:
      - '**'

jobs:
  uv-test:
    name: Pytest for the DEISM runner
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        python-version:
          - "3.11"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gmsh libglu1-mesa libgl1 mesa-utils

      - name: Run test for DEISM method
        run: |
          cd deism_method
          uv run --extra tests pytest tests/

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker Image
        run: |
          docker build -f deism_method/Dockerfile . --platform=linux/amd64 -t deism-method-test:latest
