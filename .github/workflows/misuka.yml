name: misuka Method CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "**"
  push:
    branches:
      - "**"

jobs:
  build-docker-image:
    name: Build misuka Docker image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        id: docker_build
        continue-on-error: true
        run: |
          docker buildx build -f misuka_method/Dockerfile . \
            --platform=${{ matrix.platform }} \
            -t misuka-method-test:latest \
            --load 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log-${{ strategy.job-index }}
          path: build.log

      - name: Fail job if build failed
        if: steps.docker_build.outcome == 'failure'
        run: exit 1
