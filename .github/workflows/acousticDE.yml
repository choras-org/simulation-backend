name: acousticDE Interface Tests

on:
  push:
    branches:
      - "**"

jobs:
  uv-test:
    name: Pytest for the acousticDE runner
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gmsh libglu1-mesa libgl1 mesa-utils

      - name: Run test for the acousticDE method
        run: |
          cd de_method
          uv run --extra tests pytest tests/

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker Image
        run: |
          docker build -f de_method/Dockerfile . -t de-method-test:latest
