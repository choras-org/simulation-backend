name: acousticDE Interface Tests

on:
  push:
    branches:
      - "**"
    tags:
      - "de-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish as an image, e.g. de-v0.2.0
        required: true
        type: string

jobs:
  uv-test:
    name: Pytest for the acousticDE runner
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gmsh libglu1-mesa libgl1 mesa-utils

      - name: Run test for the acousticDE method
        run: |
          cd de_method
          uv run --extra tests pytest tests/

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker Image
        run: |
          docker build -f de_method/Dockerfile . --platform=linux/amd64 -t de-method-test:latest

  publish:
    name: Publish Docker image
    if: startsWith(github.ref, 'refs/tags/de-v') || startsWith(inputs.tag, 'de-v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-method-image.yml
    with:
      method: de
      tag: ${{ inputs.tag || github.ref_name }}
